{% extends "base.html" %}
{% block content %}
<h2>Login</h2>

<form method="POST">
    <div class="mb-3">
        <label>E-mail</label>
        <input type="email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
        <label>Senha</label>
        <input type="password" name="senha" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary">Login</button>
</form>

<p class="mt-3">Não tem uma conta? <a href="{{ url_for('registro') }}">Registre-se aqui</a>.</p>

{% endblock %}
