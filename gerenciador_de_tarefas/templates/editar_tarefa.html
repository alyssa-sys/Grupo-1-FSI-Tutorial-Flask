{% extends "base.html"%}
{% block content %}
<h2>Editar Tarefa</h2>
<form method="POST">
    <div class="mb-3">
        <label>Titulo</label>
        <input type="text" name="titulo" class="form-control" value="{{ tarefa.titulo }}" required>
    </div>
    <div class="mb-3">
        <label>Descrição</label>
        <textarea name="descricao" class="form-control" required>{{ tarefa.descricao }}</textarea>
    </div>
    <div class="mb-3">
        <label>Status</label>
        <select name="status" class="form-control">
            <option value="A fazer" {% if tarefa.status == 'A fazer' %}selected{% endif %}>A fazer</option>
            <option value="Em andamento" {% if tarefa.status == 'Em andamento' %}selected{% endif %}>Em andamento</option>
            <option value="Concluída" {% if tarefa.status == 'Concluída' %}selected{% endif %}>Concluída</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
</form>
{% endblock %}
